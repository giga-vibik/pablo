server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Видео летит через nginx: дефолтный лимит в 1 МБ режет любую загрузку.
    # Держим его в одну строку с потолком бэкенда (maxVideoSize).
    client_max_body_size 512m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Встроенный DNS docker. Имя в proxy_pass задано переменной намеренно: с
    # литеральным именем nginx резолвит его при старте и падает целиком, если
    # service ещё не поднялся. С переменной резолв ленивый, на каждый запрос,
    # и фронт продолжает открываться, даже когда бэкенд лежит.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /v1/ {
        set $backend http://service:8080;
        # С переменной nginx не подставляет URI сам — передаём его явно.
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Публикация синхронно ждёт zernio по каждой площадке, а загрузка видео
        # упирается в скорость канала — минуты здесь норма, а не зависание.
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Файл уходит потоком, а не копится целиком во временном файле nginx.
        proxy_request_buffering off;
    }

    # Хэши в именах ассетов делают их неизменяемыми.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: любой путь отдаёт index.html, роутинг разруливает react-router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
